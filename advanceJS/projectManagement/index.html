<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .customSpinner {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .form-control {
        width: 300px;
      }
      .form-select {
        margin-left: 5px;
        width: 300px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark px-3">
      <a class="navbar-brand" href="#">Project Management</a>
    </nav>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
              id="searchKey"
              oninput="searchByName()"
            />
          </form>
          <select
            id="departmentSelect"
            class="form-select"
            onchange="filterByDepartment(this.value)"
          ></select>
          <select
            id="prioritySelect"
            class="form-select"
            onchange="filterByPriority(this.value)"
          ></select>
          <select class="form-select" onchange="filterByStatus(this.value)">
            <option value="all">All Status</option>
            <option value="Completed">Completed</option>
            <option value="In Progress">In Progress</option>
          </select>
        </div>
      </div>
    </nav>
    <div class="customSpinner">
      <div class="spinner-border" role="statue">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
    <div class="container my-4" style="display: none">
      <h3 class="mb-4">Project Details</h3>
      <div
        class="row g-4"
        id="projectDetails"
        style="max-height: 430px; overflow-y: auto"
      ></div>
    </div>
    <!-- MODAL -->
    <div class="modal fade" id="projectModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="projectTitle">Project Details</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body" id="projectBody">
            <div class="modalSpinner text-center">
              <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
