<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Book</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .customSpinner {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .form-select {
        margin-left: 5px;
        width: 300px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark px-3">
      <a class="navbar-brand" href="#">Recipe App</a>
      <div>
        <button class="btn btn-primary me-2" onclick="fetchRecipe('card')">
          Card View
        </button>
        <button class="btn btn-success" onclick="fetchRecipe('table')">
          Table View
        </button>
      </div>
    </nav>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
              id="searchKey"
              oninput="searchByName()"
            />
          </form>
          <select
            id="categorySelect"
            class="form-select"
            onchange="filterByCategory(this.value)"
          ></select>
          <select
            id="countrySelect"
            class="form-select"
            onchange="filterByCountry(this.value)"
          ></select>
        </div>
      </div>
    </nav>
    <div class="customSpinner">
      <div class="spinner-border" role="statue">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
    <div class="container my-4" style="display: none">
      <h2 class="mb-4">Chicken Recipes</h2>
      <div class="row g-4" id="mealCards"></div>
    </div>
    <!-- MODAL -->
    <div class="modal fade" id="recipeModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="recipeTitle">Meal Details</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body" id="recipeBody">
            <div class="modalSpinner text-center">
              <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
