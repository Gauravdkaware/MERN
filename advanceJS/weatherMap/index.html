<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Weather</title>
    <style>
      body {
        background: #f1f5f9;
        font-family: Arial, sans-serif;
      }
      .container {
        max-width: 600px;
        margin: 50px auto !important;
        padding: 30px !important;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }
      .form-control {
        border-radius: 10px;
      }
      .weather-card {
        padding: 25px;
        text-align: center;
        color: white;
        background: linear-gradient(135deg, #2193b0, #6dd5ed);
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(33, 147, 176, 0.2);
      }
      .btn-primary {
        width: 100%;
        padding: 12px;
        margin-bottom: 25px;
        border-radius: 10px;
        font-weight: 600;
      }
      .weather-card h3 {
        margin: 12px 0;
        padding: 12px;
        font-size: 20px;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
      }
      .weather-card p {
        margin: 12px 0;
        padding: 12px;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
      }
      .temp-details {
        display: flex;
        justify-content: center;
        gap: 15px;
      }
      .temp-details {
        flex: 1;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="container m-3 p-3">
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="city"
          placeholder="Enter City"
        />
        <label for="city">Enter City</label>
      </div>
      <button class="btn btn-primary" onclick="checkWeather()">Search</button>

      <div class="weather-card">
        <div class="temp-details">
          <h3 id="countryName"></h3>
          <h3 id="cityName"></h3>
        </div>
        <p id="temp"></p>
        <div class="temp-details">
          <p id="maxTemp"></p>
          <p id="minTemp"></p>
        </div>
        <p id="humidity"></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
