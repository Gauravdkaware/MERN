<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escape Room</title>
  </head>
  <body>
    <form>
      <header><h1>Friends Group</h1></header>
      <label for="count">Player Count:</label>
      <input
        id="count"
        type="number"
        min="2"
        max="6"
        required
        title="Team must have 2 to 6 members"
      />
      &nbsp;&nbsp;
      <label for="mode">Difficulty Level:</label>
      <select id="mode" name="level">
        <option value="easy">Easy</option>
        <option value="moderate">Moderate</option>
        <option value="hard">Hard</option>
      </select>
      <br /><br />
      <label for="preferredDate">Preferred Date:</label>
      <input type="date" id="preferredDate" name="preferredDate" required />
      &nbsp;&nbsp;
      <label for="preferredTime">Preferred Time:</label>
      <input type="time" id="preferredTime" name="preferredTime" required />
      <br /><br />
      <p><strong>Please enter player names:</strong></p>
      <label for="player1">Player 1:</label>
      <input type="text" id="player1" required />
      <br /><br />
      <label for="player2">Player 2:</label>
      <input type="text" id="player2" required />
      <br /><br />
      <label for="player3">Player 3:</label>
      <input type="text" id="player3" />
      <br /><br />
      <label for="player4">Player 4:</label>
      <input type="text" id="player4" />
      <br /><br />
      <label for="player5">Player 5:</label>
      <input type="text" id="player5" />
      <br /><br />
      <label for="player6">Player 6:</label>
      <input type="text" id="player6" />
      <br /><br />
      <p><strong>Please agree to the following rules:</strong></p>

      <input type="checkbox" required />
      I will follow all the game rules.<br />

      <input type="checkbox" required />
      I understand that registration cannot be canceled after submission.<br />

      <input type="checkbox" required />
      I will arrive at the venue on time.<br />

      <input type="checkbox" required />
      I agree to participate at my own responsibility.<br />
      <br /><br />
      <br /><br />
      <button type="submit">Book</button>
    </form>
  </body>
</html>
