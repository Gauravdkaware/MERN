<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Pass</title>
  </head>
  <body>
    <header><h1>Event Pass Registration</h1></header>
    <form action="">
      <label for="event">Event Name:</label>
      <input
        type="text"
        id="event"
        name="event"
        placeholder="Enter event name"
        required
      />
      <br /><br />

      <label for="participant">Participant Name:</label>
      <input
        type="text"
        id="participant"
        name="participant"
        placeholder="Enter your name"
        required
      />
      <br /><br />

      <label for="date">Date:</label>
      <input type="date" id="date" name="date" required />
      &nbsp;&nbsp;
      <label for="venue">Venue:</label>
      <input
        type="text"
        id="venue"
        name="venue"
        placeholder="Enter venue"
        required
      />
      <br /><br />

      <label for="pass">Pass Type:</label>
      <select id="pass" name="pass" required>
        <option value="">--Select Pass Type--</option>
        <option value="general">General</option>
        <option value="vip">VIP</option>
        <option value="premium">Premium</option>
      </select>
      <br /><br />

      <label>Meal Preference:</label>
      <input type="radio" id="veg" name="meal" value="Veg" required />
      <label for="veg">Veg</label>
      <input type="radio" id="nonveg" name="meal" value="Non-Veg" />
      <label for="nonveg">Non-Veg</label>
      <br /><br />

      <label for="contact">Contact Number:</label>
      <input
        type="tel"
        id="contact"
        name="contact"
        pattern="[6-9][0-9]{9}"
        placeholder="Enter your mobile number"
        required
      />
      <br /><br />

      <label for="image">Pass Image:</label>
      <input type="file" id="image" name="image" accept="image/*" required />
      <br /><br />

      <button type="submit">Generate Pass</button>
    </form>
  </body>
</html>
