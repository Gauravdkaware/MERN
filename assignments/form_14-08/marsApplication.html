<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mars Colony Application</title>
  </head>
  <body>
    <header><h1>Mars Colony Application</h1></header>
    <form action="">
      <label for="name">Name:</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your name"
        required
      />
      <br /><br />

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="18" max="60" required />
      <br /><br />

      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      />
      <br /><br />

      <p><strong>Skills:</strong></p>
      <input
        type="checkbox"
        id="engineering"
        name="skills"
        value="Engineering"
      />
      <label for="engineering">Engineering</label>
      <br />
      <input
        type="checkbox"
        id="programming"
        name="skills"
        value="Programming"
      />
      <label for="programming">Programming</label>
      <br />
      <input type="checkbox" id="robotics" name="skills" value="Robotics" />
      <label for="robotics">Robotics</label>
      <br />
      <input type="checkbox" id="medicine" name="skills" value="Medicine" />
      <label for="medicine">Medicine</label>
      <br /><br />

      <label for="role">Colony Role:</label>
      <select id="role" name="role" required>
        <option value="">-- Select a Role --</option>
        <option value="engineer">Engineer</option>
        <option value="scientist">Scientist</option>
        <option value="doctor">Doctor</option>
        <option value="pilot">Pilot</option>
      </select>
      <br /><br />

      <label for="experience">Experience (in years):</label>
      <input
        type="number"
        id="experience"
        name="experience"
        min="0"
        max="50"
        placeholder="Enter your experience"
        required
      />
      <br /><br />

      <label for="reason">Why should you be selected?</label>
      <br />
      <textarea
        id="reason"
        name="reason"
        rows="5"
        cols="40"
        placeholder="Explain why you should be selected"
        required
      ></textarea>
      <br /><br />

      <button type="submit">Apply</button>
    </form>
  </body>
</html>
