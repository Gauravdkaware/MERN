<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mystery Box Order</title>
  </head>

  <body>
    <h1>Mystery Box Order</h1>

    <form>
      <label for="box">Box Type:</label>
      <select id="box" name="box" required>
        <option value="">-- Select a Box --</option>
        <option value="gaming">Gaming Box</option>
        <option value="electronics">Electronics Box</option>
        <option value="books">Books Box</option>
        <option value="surprise">Surprise Box</option>
      </select>
      <br /><br />

      <label for="price">Price:</label>
      <input
        type="number"
        id="price"
        name="price"
        min="100"
        placeholder="Enter the price"
        required
      />
      <br /><br />

      <label for="quantity">Quantity:</label>
      <input
        type="number"
        id="quantity"
        name="quantity"
        min="1"
        max="10"
        required
      />
      <br /><br />

      <p><strong>Preferred Items:</strong></p>
      <input type="checkbox" id="gadgets" name="items" value="Gadgets" />
      <label for="gadgets">Gadgets</label>
      <br />
      <input
        type="checkbox"
        id="accessories"
        name="items"
        value="Accessories"
      />
      <label for="accessories">Accessories</label>
      <br />
      <input type="checkbox" id="books" name="items" value="Books" />
      <label for="books">Books</label>
      <br />
      <input
        type="checkbox"
        id="collectibles"
        name="items"
        value="Collectibles"
      />
      <label for="collectibles">Collectibles</label>
      <br /><br />

      <label for="address">Delivery Address:</label>
      <br />
      <textarea
        id="address"
        name="address"
        rows="5"
        cols="40"
        placeholder="Enter your delivery address"
        required
      ></textarea>
      <br /><br />

      <label for="instructions">Instructions:</label>
      <br />
      <textarea
        id="instructions"
        name="instructions"
        rows="4"
        cols="40"
        placeholder="Additional instructions"
      ></textarea>
      <br /><br />

      <button type="submit">Place Order</button>
    </form>
  </body>
</html>
