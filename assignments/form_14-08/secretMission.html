<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secret Mission Form</title>
  </head>
  <body>
    <header><h1>Secret Mission Form</h1></header>
    <form>
      <label for="agent">Agent Name:</label>
      <input
        type="text"
        id="agent"
        name="agent"
        placeholder="Enter agent name"
        required
      /><br /><br />
      <label for="mission">Mission Type:</label>
      <select id="mission" name="mission" required>
        <option value="">-- Select Mission Type --</option>
        <option value="rescue">Rescue</option>
        <option value="surveillance">Surveillance</option>
        <option value="investigation">Investigation</option>
        <option value="undercover">Undercover</option>
      </select>
      <br /><br />
      <label>Priority:</label>
      <input type="radio" id="low" name="priority" value="Low" required />
      <label for="low">Low</label>
      <input type="radio" id="medium" name="priority" value="Medium" />
      <label for="medium">Medium</label>
      <input type="radio" id="high" name="priority" value="High" />
      <label for="high">High</label>
      <br /><br />
      <label for="location">Location:</label>
      <input
        type="text"
        id="location"
        name="location"
        placeholder="Enter mission location"
        required
      />
      <br /><br />
      <p><strong>Select Equipment:</strong></p>
      <input type="checkbox" id="camera" name="equipment" value="Camera" />
      <label for="camera">Camera</label>
      <br /><input
        type="checkbox"
        id="laptop"
        name="equipment"
        value="Laptop"
      />
      <label for="laptop">Laptop</label>
      <br />
      <input type="checkbox" id="gps" name="equipment" value="GPS" />
      <label for="gps">GPS Tracker</label>
      <br />
      <input type="checkbox" id="radio" name="equipment" value="Radio" />
      <label for="radio">Radio</label>
      <br /><br />
      <label for="instructions">Mission Instructions:</label>
      <br />
      <textarea
        id="instructions"
        name="instructions"
        rows="5"
        cols="40"
        placeholder="Enter mission instructions"
      ></textarea>
      <br /><br />
      <button type="submit">Accept Mission</button>
    </form>
  </body>
</html>
