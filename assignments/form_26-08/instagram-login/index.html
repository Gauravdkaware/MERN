<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instagram LogIn</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container-fluid login-container">
      <div class="row login-box">
        <!-- Left -->
        <div class="col-md-6 left-side">
          <i class="fa-brands fa-instagram instagram-icon"></i>

          <h1>
            See everyday moments from
            <br />
            your <span>close friends.</span>
          </h1>
          <img
            src="./assets/insta-login.webp"
            class="instagram-image"
            alt="Instagram"
          />
        </div>

        <!-- Right -->
        <div class="col-md-6 right-side">
          <div class="login-form">
            <h5>Log into Instagram</h5>

            <input
              type="text"
              class="form-control"
              placeholder="Mobile number, username or email"
            />
            <input
              type="password"
              class="form-control"
              placeholder="Password"
            />

            <button class="login-btn">Log in</button>

            <a href="#" class="forgot-password"> Forgot password? </a>

            <a href="#" class="facebook-login mt-3">
              <i class="fa-brands fa-facebook"></i>
              Log in with Facebook
            </a>
            <button class="create-account">Create new account</button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
