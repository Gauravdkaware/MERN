<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registration</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container-fluid main-container w-100 py-3">
      <div class="registration-container my-4">
        <h3><b>Registration</b></h3>
        <h5 class="text-secondary mt-4"><b>Personal Details</b></h5>
        <div class="row g-2">
          <div class="col-lg-4 col-md-6 col-12">
            <label for="name" class="form-label"><b>Full Name</b></label>
            <input
              type="text"
              class="form-control"
              id="name"
              placeholder="Enter your name"
            />
          </div>
          <div class="col-lg-4 col-md-6 col-12">
            <label for="dob" class="form-label"><b>Date of Birth</b></label>
            <input
              type="date"
              class="form-control"
              id="dob"
              placeholder="Enter birth date"
            />
          </div>
          <div class="col-lg-4 col-md-6 col-12">
            <label for="email" class="form-label"><b>Email address</b></label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Enter your email"
            />
          </div>
          <div class="col-lg-4 col-md-6 col-12">
            <label for="mobile" class="form-label"><b>Mobile Number</b></label>
            <input
              type="number"
              class="form-control"
              id="mobile"
              placeholder="Enter mobile number"
            />
          </div>
          <div class="col-lg-4 col-md-6 col-12">
            <label for="gender" class="form-label"><b>Gender</b></label>
            <div>
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="gender"
                  id="male"
                  value="male"
                />
                <label class="form-check-label" for="male">Male</label>
              </div>
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="gender"
                  id="female"
                  value="female"
                />
                <label class="form-check-label" for="female">Female</label>
              </div>
            </div>
          </div>
          <div class="col-lg-4 col-md-6 col-12">
            <label for="occupation" class="form-label"><b>Occupation</b></label>
            <select class="form-select" aria-label="Default select example">
              <option selected>Select occupation</option>
              <option value="1">Engineer</option>
              <option value="2">Doctor</option>
              <option value="3">Teacher</option>
            </select>
          </div>
        </div>

        <h5 class="text-secondary mt-4"><b>Identity Details</b></h5>
        <div class="row g-2">
          <div class="col-lg-4 col-md-6 col-12">
            <label for="idType" class="form-label"><b>ID Type</b></label>
            <select class="form-select" aria-label="Default select example">
              <option selected>Select ID type</option>
              <option value="1">Aadhar Card</option>
              <option value="2">Pan card</option>
              <option value="3">Passport</option>
            </select>
          </div>
          <div class="col-lg-4 col-md-6 col-12">
            <label for="idNo" class="form-label"><b>ID Number</b></label>
            <input
              type="number"
              class="form-control"
              id="idNo"
              placeholder="Enter ID number"
            />
          </div>
          <div class="col-lg-4 col-md-6 col-12">
            <label for="authority" class="form-label"
              ><b>Issue Authority</b></label
            >
            <select class="form-select" aria-label="Default select example">
              <option selected>Select issue department</option>
              <option value="1">Taluka</option>
              <option value="2">District</option>
              <option value="3">State</option>
            </select>
          </div>
          <div class="col-lg-4 col-md-6 col-12">
            <label for="issueDate" class="form-label"><b>Issue Date</b></label>
            <input
              type="date"
              class="form-control"
              id="issueDate"
              placeholder="Select issue date"
            />
          </div>
          <div class="col-lg-4 col-md-6 col-12">
            <label for="issueState" class="form-label"
              ><b>Issue State</b></label
            >
            <input
              type="text"
              class="form-control"
              id="issueState"
              placeholder="Enter ID issue state"
            />
          </div>
          <div class="col-lg-4 col-md-6 col-12">
            <label for="expiryDate" class="form-label"
              ><b>Expiry Date</b></label
            >
            <input
              type="date"
              class="form-control"
              id="expiryDate"
              placeholder="Select expiry date"
            />
          </div>
        </div>

        <button class="btn next-button"><b>Next -></b></button>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
