<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fruits</title>
    <style>
      .container {
        height: 550px;
        width: 550px;
        display: grid;
        grid-template-areas:
          "grape strawberry watermelon watermelon"
          "oranges oranges watermelon watermelon"
          "oranges oranges watermelon watermelon"
          "papaya papaya pineapple pineapple"
          "papaya papaya pineapple pineapple";

        gap: 10px;
        margin: 0 auto;
      }
      .grapes {
        grid-area: grape;
      }
      .strawberry {
        grid-area: strawberry;
      }
      .watermelon {
        grid-area: watermelon;
      }
      .orange {
        grid-area: oranges;
      }
      .papaya {
        grid-area: papaya;
      }
      .pineapple {
        grid-area: pineapple;
      }
      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="grapes">
        <img src="./assets/fruits/grapes.jpg" alt="" />
      </div>
      <div class="strawberry">
        <img src="./assets/fruits/strawberry.jpg" alt="" />
      </div>
      <div class="watermelon">
        <img src="./assets/fruits/watermelon.jpg" alt="" />
      </div>
      <div class="orange">
        <img src="./assets/fruits/oranges.jpg" alt="" />
      </div>
      <div class="papaya">
        <img src="./assets/fruits/papaya.jpg" alt="" />
      </div>
      <div class="pineapple">
        <img src="./assets/fruits/pineapple.jpg" alt="" />
      </div>
    </div>
  </body>
</html>
