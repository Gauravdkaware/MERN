<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jungle</title>
    <style>
      .container {
        width: 1000px;
        height: 600px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: 265px 265px 70px;
        gap: 5px;
        margin-left: 50px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
        margin: 0 auto;
      }
      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .one {
        grid-column: 1 / 2;
        grid-row: 1 / 2;
      }
      .two {
        grid-column: 2 / 4;
        grid-row: 1 / 2;
      }
      .three {
        grid-column: 1 / 3;
        grid-row: 2 / 3;
      }
      .four {
        grid-column: 3 / 4;
        grid-row: 2 / 3;
      }
      .five {
        grid-column: 1 / 2;
        grid-row: 3 / 4;
      }
      .six {
        grid-column: 2 / 3;
        grid-row: 3 / 4;
      }
      .seven {
        grid-column: 3 / 4;
        grid-row: 3 / 4;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item one">
        <img src="/assests/jungle/jungle-one.jpg" alt="" />
      </div>
      <div class="item two">
        <img src="/assests/jungle/jungle-two.jpg" alt="" />
      </div>
      <div class="item three">
        <img src="/assests/jungle/jungle-three.jpg" alt="" />
      </div>
      <div class="item four">
        <img src="/assests/jungle/jungle-four.jpg" alt="" />
      </div>
      <div class="item five">
        <img src="/assests/jungle/jungle-five.jpg" alt="" />
      </div>
      <div class="item six">
        <img src="/assests/jungle/jungle-six.jpg" alt="" />
      </div>
      <div class="item seven">
        <img src="/assests/jungle/jungle-seven.jpg" alt="" />
      </div>
    </div>
  </body>
</html>
