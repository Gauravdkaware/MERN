<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Piece</title>
    <style>
      .container {
        width: 400px;
        display: grid;
        padding: 10px;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        margin: 0 auto;
        background-color: rgb(219, 219, 219);
      }
      .item {
        width: 90%;
        height: 95%;
        margin: auto;
      }
      .item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
      }
      .item:hover img {
        transform: scale(1.3);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">
        <img src="/assests/one-piece/gol-d-roger.jpg" alt="" />
      </div>
      <div class="item">
        <img src="/assests/one-piece/whitebeard.webp" alt="" />
      </div>
      <div class="item">
        <img src="/assests/one-piece/silver-rayliegh.jpg" alt="" />
      </div>
      <div class="item">
        <img src="/assests/one-piece/shanks.webp" alt="" />
      </div>
      <div class="item">
        <img src="/assests/one-piece/kaidou.webp" alt="" />
      </div>
      <div class="item">
        <img src="/assests/one-piece/blackbeard.jpg" alt="" />
      </div>
      <div class="item">
        <img src="/assests/one-piece/luffy.webp" alt="" />
      </div>
      <div class="item">
        <img src="/assests/one-piece/zoro.webp" alt="" />
      </div>
      <div class="item">
        <img src="/assests/one-piece/mihawk.webp" alt="" />
      </div>
    </div>
  </body>
</html>
