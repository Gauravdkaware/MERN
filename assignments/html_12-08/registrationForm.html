<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration</title>
  </head>
  <body>
    <header><h1 align="center">Student Registration</h1></header>
    <form action="" method="get">
      <label for="fName">First Name:</label>
      <input
        id="fName"
        type="text"
        name="firstName"
        required
        placeholder="First Name"
        pattern="[A-Za-z]+"
        title="First name should contain only letters"
      />
      &nbsp;&nbsp;
      <label for="lName">Last Name:</label>
      <input
        id="lName"
        type="text"
        name="lastName"
        required
        placeholder="Last Name"
        pattern="[A-Za-z]+"
        title="Last name should contain only letters"
      /><br /><br />
      <label for="email">Email:</label>
      <input
        id="email"
        type="email"
        name="email"
        required
        placeholder="Email Address"
      />&nbsp;&nbsp;
      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        minlength="6"
        maxlength="8"
        required
      />
      <br /><br />
      <label>Gender:</label>
      <input type="radio" id="male" name="gender" value="male" /> Male
      <input type="radio" id="female" name="gender" value="female" /> Female
      <br /><br />
      <label for="course">Course:</label>
      <input type="checkbox" id="java" name="course" value="java" /> Java
      <input type="checkbox" id="mern" name="course" value="mern" /> MERN
      <input type="checkbox" id="python" name="course" value="python" /> Python
      <input type="checkbox" id="genAI" name="course" value="genAI" /> Gen AI
      <input type="checkbox" id="aws" name="course" value="aws" /> AWS
      <br /><br />
      <br /><br />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
