<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Array Operations</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- 4. Calculator -->
    <h3 class="display-6 text-primary p-2 ms-5">4. Calculator</h3>
    <div class="container">
      <div class="row">
        <div class="col">
          <input
            type="number"
            class="form-control"
            id="inputOne"
            placeholder="Enter Number..."
          />
        </div>
        <div class="col">
          <input
            type="number"
            class="form-control"
            id="inputTwo"
            placeholder="Enter Number..."
          />
        </div>
      </div>
      <div class="row mt-3">
        <div class="col">
          <button class="btn btn-primary" onclick="add()">Add</button>
          <button class="btn btn-primary" onclick="subtract()">Subtract</button>
          <button class="btn btn-primary" onclick="multiply()">Multiply</button>
          <button class="btn btn-primary" onclick="divide()">Divide</button>
        </div>
      </div>

      <div class="row mt-3">
        <p>Result : <b id="result"></b></p>
      </div>
    </div>

    <script src="./script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
