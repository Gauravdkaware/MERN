<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BString Operations</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1 class="display-4 text-primary text-center p-4">
      String Operations In JS
    </h1>

    <div class="container">
      <input
        type="text"
        class="form-control"
        placeholder="Enter input here..."
        id="inputPara"
      />
      <div
        class="container bg-primary-subtle rounded-2 pt-2 mt-3"
        style="height: 50px"
        id="result"
      >
        Result...
      </div>
    </div>
    <div class="container mt-4">
      <div class="row">
        <div class="col">
          <button class="btn btn-primary" onclick="countVowels()">
            Count Vowels
          </button>
        </div>
        <div class="col">
          <button class="btn btn-primary" onclick="countConsonants()">
            Count Consonants
          </button>
        </div>
        <div class="col">
          <button class="btn btn-primary" onclick="checkPalindrome()">
            Check Palindrome
          </button>
        </div>
        <div class="col">
          <button class="btn btn-primary" onclick="extractFirstWord()">
            Extract First Word
          </button>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col">
          <button class="btn btn-primary" onclick="replaceSpace()">
            Replace Space With Hypen
          </button>
        </div>
        <div class="col">
          <button class="btn btn-primary" onclick="splitString()">
            Split String To Array
          </button>
        </div>
        <div class="col">
          <button class="btn btn-primary" onclick="convertToUpperCase()">
            To Upper Case
          </button>
        </div>
        <div class="col">
          <button class="btn btn-primary" onclick="convertToTitleCase()">
            Convert to Title Case
          </button>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col">
          <button class="btn btn-primary" onclick="reverseString()">
            Reverse the String
          </button>
        </div>
        <div class="col">
          <button class="btn btn-primary" onclick="countSpecificChar()">
            !Count Specific Character
          </button>
        </div>
        <div class="col">
          <button class="btn btn-primary" onclick="removeNonAlphaNumeric()">
            Remove All Non-Alphanumeric
          </button>
        </div>
        <div class="col">
          <button class="btn btn-primary" onclick="checkStartEndChar()">
            Check Start End Same Char
          </button>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
