<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header><h1 align="center">Select Course</h1></header>
    <form action="" method="get">
      <label for="fName">First Name:</label>
      <input
        type="text"
        id="fName"
        placeholder="First Name"
        pattern="[a-zA-Z]"
      />
      &nbsp;&nbsp;
      <label for="lName">Last Name:</label>
      <input
        type="text"
        id="lName"
        placeholder="Last Name"
        pattern="[a-zA-Z]"
      />&nbsp;&nbsp;
      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        placeholder="Password"
        min="6"
        max="8"
      />
      <br /><br />
      <label for="mobile">Mobile Number:</label>
      <input type="number" id="mobile" placeholder="Mobile Number" />
      &nbsp;&nbsp;
      <label for="sDate">Start Date:</label>
      <input type="date" id="sDate" /> &nbsp;&nbsp;
      <label for="address">Address:</label>
      <textarea type="text" id="address"></textarea>
      <br /><br />
      <label for="mode">Mode:</label>
      <input type="radio" id="mode" value="online" /> Online
      <input type="radio" id="mode" value="offline" /> Offline <br /><br />
      <label for="course">Course:</label>
      <input type="checkbox" id="course" value="java" /> Java
      <input type="checkbox" id="course" value="mern" /> MERN
      <input type="checkbox" id="course" value="python" /> Python
      <input type="checkbox" id="course" value="genAI" /> Gen AI
      <input type="checkbox" id="course" value="aws" /> AWS <br /><br />
      <label for="resume">Upload Resume:</label>
      <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" />
      &nbsp;&nbsp;
      <label for="color">Choose Color:</label>
      <input type="color" id="color" name="color" />
      <label for="volume">Volume:</label>
      <input type="range" id="volume" name="volume" />
      <br /><br />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
