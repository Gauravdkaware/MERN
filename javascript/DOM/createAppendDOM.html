<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOM Manipulation</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .color-circle {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid white;
        outline: 1px solid #999;
        cursor: pointer;
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <div id="companyName"></div>
    <button id="changeFormat" class="btn btn-primary btn-sm">
      Change Format
    </button>
    <br />
    <img
      src="../javascript/assets/off-bulb.png"
      alt=""
      id="bulbImg"
      style="height: 200px; width: 200px"
    />
    <button id="bulbBtn" class="btn btn-primary btn-sm">ON</button>
    <div class="container mt-5">
      <div class="card">
        <img
          id="carImage"
          src="../javascript/assets/dark.avif"
          alt=""
          style="height: 330px; width: 550px"
        />
        <div class="card-body">
          <h4 class="card-title">TATA Nexon</h4>
          <ul class="list-group list-group-flush mb-3">
            <li class="list-group-item">Engine: 1497 cc Turbocharged</li>
            <li class="list-group-item">
              Transmission: Manual & Automatic (AMT)
            </li>
            <li class="list-group-item">Power: 113 bhp</li>
          </ul>
          <p class="fw-bold mb-2">Choose Color:</p>

          <!-- Color circles -->
          <button
            class="color-circle"
            id="black"
            style="background-color: black"
          ></button>
          <button
            class="color-circle"
            id="gray"
            style="background-color: gray"
          ></button>
          <button
            class="color-circle"
            id="blue"
            style="background-color: rgb(11, 11, 52)"
          ></button>
        </div>
      </div>
    </div>

    <script>
      divCName = document.querySelector("#companyName");
      h1Elem = document.createElement("h1");
      cData = document.createTextNode("Wisdom Sprouts");
      h1Elem.appendChild(cData);
      h1Elem.style.color = "#0387A3";
      h1Elem.style.textAlign = "center";

      pElem = document.createElement("p");
      pData = document.createTextNode(
        "I'm learning frontend technologies forl ast 2 months.",
      );
      pElem.appendChild(pData);
      pElem.style.backgroundColor = "gray";
      pElem.style.padding = "5px";
      pElem.style.textAlign = "center";

      divCName.appendChild(h1Elem);
      divCName.appendChild(pElem);

      document.querySelector("#changeFormat").addEventListener("click", () => {
        h1Emt = document.querySelector("h1");
        pEmt = document.querySelector("p");
        h1Emt.textContent = "Scalefull Technologies";
        h1Emt.style.border = "2px solid gray";
        pEmt.style.backgroundColor = "yellow";
      });
    </script>
    <script>
      bulbImgEmt = document.querySelector("#bulbImg");
      bulbBtnEmt = document.querySelector("#bulbBtn");
      bulbImgEmt.style.marginTop = "15px";
      document.querySelector("#bulbBtn").addEventListener("click", () => {
        bulbImgEmt.getAttribute("src") == "../javascript/assets/off-bulb.png"
          ? bulbImgEmt.setAttribute("src", "../javascript/assets/on-bulb.png")
          : bulbImgEmt.setAttribute("src", "../javascript/assets/off-bulb.png");

        bulbImgEmt.getAttribute("src") == "../javascript/assets/off-bulb.png"
          ? (bulbBtnEmt.textContent = "ON")
          : (bulbBtnEmt.textContent = "OFF");
      });
    </script>
    <script>
      let carImage = document.querySelector("#carImage");
      let colorCircles = document.querySelectorAll(".color-circle");

      document.querySelector("#black").addEventListener("click", function () {
        carImage.setAttribute("src", "../javascript/assets/dark.avif");
      });
      document.querySelector("#gray").addEventListener("click", function () {
        carImage.setAttribute("src", "../javascript/assets/pure-gray.avif");
      });
      document.querySelector("#blue").addEventListener("click", function () {
        carImage.setAttribute("src", "../javascript/assets/royale-blue.avif");
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
