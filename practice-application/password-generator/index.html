<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="box">
      <h3>Password Generator</h3>

      <label for="length" class="form-label">Password Length</label>
      <input
        type="number"
        id="length"
        class="form-control mb-4"
        min="4"
        max="64"
        value="16"
      />

      <div class="mb-4">
        <div class="form-check">
          <input
            type="checkbox"
            class="form-check-input"
            id="numbers"
            checked
          />
          <label class="form-check-label" for="numbers">Include numbers</label>
        </div>

        <div class="form-check">
          <input
            type="checkbox"
            class="form-check-input"
            id="special"
            checked
          />
          <label class="form-check-label" for="special"
            >Include special characters</label
          >
        </div>

        <div class="form-check">
          <input
            type="checkbox"
            class="form-check-input"
            id="uppercase"
            checked
          />
          <label class="form-check-label" for="uppercase"
            >Include uppercase</label
          >
        </div>

        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="ambiguous" />
          <label class="form-check-label" for="ambiguous"
            >Exclude ambiguous characters</label
          >
        </div>
      </div>

      <button class="btn-generate mb-4" id="generateBtn">
        Generate Password
      </button>

      <label for="password" class="form-label">Generated Password</label>
      <input
        type="password"
        id="password"
        class="form-control mb-3"
        placeholder="Your password will appear here"
        readonly
      />

      <div class="form-check mb-4">
        <input type="checkbox" class="form-check-input" id="showPassword" />
        <label class="form-check-label" for="showPassword">Show password</label>
      </div>

      <label class="form-label">Password Strength</label>
      <div class="strength-track">
        <div id="strengthBar"></div>
      </div>

      <div id="strengthText">Not generated yet</div>
      <div id="message"></div>
    </div>
  </body>
  <script src="script.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</html>
